<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Lords</title>

    <!-- jQuery library -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- jQuery UI library -->
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>

    <!-- jQuery UI CSS -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">

    <!-- My CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>TicketLords!</h1>
    </header>
    <div class="topnav">
        <a class="active" href="homepage.html">Home</a>
        <a href="aboutus.html">About Us</a>
        <a href="upcoming.html">Upcoming Gigs</a>
        <a href="contact.html">Sign-Up</a>
    </div>
    <main>
        <div class="banner-search">
            <label for="venueFilter">Venue:</label>
            <select id="venueFilter" aria-label="Filter gigs by venue">
                <option value="all">All Venues</option>
                <option value="customhouse">Custom House Square</option>
                <option value="empire">Empire Music Hall</option>
                <option value="limelight">LimeLight</option>
                <option value="mandela">Mandela Hall</option>
                <option value="ohyeah">Oh Yeah Music Centre</option>
                <option value="voodoo">Voodoo</option>
            </select>
            <label for="dateFilter">Date:</label>
            <input type="text" id="dateFilter" aria-label="Filter gigs by date">
            <label for="searchBoth">Search:</label>
            <input type="text" id="searchBoth" aria-label="Search by artist, event or venue">
            <div id="gigList" aria-live="polite"></div>
        </div>
    </main>
    <script src="main.js"></script>
</body>
</html>
